server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # WebSocket proxy for Y.js real-time collaboration
    location /collab/ {
        proxy_pass         http://mykhub_backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Uploaded images served via backend
    location /uploads/ {
        proxy_pass       http://mykhub_backend:3000;
        proxy_set_header Host $host;
        expires          30d;
        add_header       Cache-Control "public, immutable";
    }

    # Proxy API calls to backend (reachable via internal_net)
    location /api/ {
        proxy_pass         http://mykhub_backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Share single page
    location ~ ^/s/[a-f0-9]+$ {
        try_files /share.html =404;
    }

    # Share whole space
    location ~ ^/ws/[a-f0-9]+$ {
        try_files /share-space.html =404;
    }

    # No caching for HTML, JS and CSS (allows hot-updating files in the container)
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # SPA: every non-file route serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json;
}
