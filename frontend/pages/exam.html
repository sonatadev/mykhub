<div class="page-header">
  <h1 class="page-title">Modalità Esame</h1>
  <p class="page-subtitle">Metti alla prova le tue domande/risposta</p>
</div>

<!-- Setup -->
<div id="exam-setup">
  <div class="card" style="max-width:400px">
    <div class="form-group">
      <label class="form-label">Materia</label>
      <select class="form-select" id="exam-subject">
        <option value="">Tutte le materie</option>
      </select>
    </div>
    <p style="font-size:.85rem;color:var(--text-muted);margin-bottom:16px">
      Verranno usate solo le schede di tipo <strong>Domanda/Risposta</strong>.
    </p>
    <button class="btn btn-primary" id="btn-exam-start">Inizia esame</button>
  </div>
</div>

<!-- Exam area -->
<div id="exam-area" class="hidden">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <span style="font-size:.875rem;color:var(--text-muted)" id="exam-counter">1 / 10</span>
  </div>

  <div class="study-card">
    <div class="study-question" id="exam-question"></div>
    <div class="study-answer hidden" id="exam-answer">
      <div style="font-size:.8rem;font-weight:600;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em">Risposta</div>
      <div class="study-body" id="exam-answer-text"></div>
    </div>
  </div>

  <div style="display:flex;justify-content:center;margin-bottom:16px">
    <button class="btn btn-primary" id="btn-show-answer">Mostra risposta</button>
  </div>

  <div class="study-nav hidden" id="exam-buttons">
    <button class="btn btn-danger" id="btn-incorrect">✗ Non lo sapevo</button>
    <button class="btn btn-success" id="btn-correct">✓ Lo sapevo</button>
  </div>
</div>

<!-- Results -->
<div id="exam-results" class="hidden">
  <h2 class="section-title">Risultati</h2>
  <div class="stats-grid" style="margin-bottom:20px">
    <div class="card"><div class="stat-value" id="res-total">0</div><div class="stat-label">Domande</div></div>
    <div class="card"><div class="stat-value" style="color:var(--success)" id="res-correct">0</div><div class="stat-label">Corrette</div></div>
    <div class="card"><div class="stat-value" style="color:var(--danger)" id="res-incorrect">0</div><div class="stat-label">Errate</div></div>
    <div class="card"><div class="stat-value" id="res-pct">0%</div><div class="stat-label">Punteggio</div></div>
  </div>

  <h2 class="section-title">Per materia</h2>
  <div id="res-subjects" style="margin-bottom:24px"></div>

  <h2 class="section-title">Errori da rivedere</h2>
  <div id="res-errors" style="margin-bottom:24px"></div>

  <button class="btn btn-primary" id="btn-exam-restart">↺ Nuovo esame</button>
</div>
