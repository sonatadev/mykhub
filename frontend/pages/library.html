<div class="page-header">
  <h1 class="page-title">Libreria</h1>
  <p class="page-subtitle">Tutte le tue schede</p>
</div>

<div class="toolbar">
  <select class="form-select" id="filter-subject" style="width:auto">
    <option value="">Tutte le materie</option>
    <option>Italiano</option>
    <option>Inglese</option>
    <option>Informatica</option>
    <option>Sistemi e Reti</option>
  </select>
  <select class="form-select" id="filter-type" style="width:auto">
    <option value="">Tutti i tipi</option>
    <option value="summary">Riassunto</option>
    <option value="qa">Domanda/Risposta</option>
    <option value="note">Nota</option>
  </select>
  <select class="form-select" id="filter-done" style="width:auto">
    <option value="">Tutti gli stati</option>
    <option value="todo">Da studiare</option>
    <option value="done">Studiate</option>
  </select>
  <input class="search-input" type="search" id="search-q" placeholder="Cerca…" />
  <div class="toolbar-right">
    <button class="btn btn-primary" id="btn-add-card">+ Aggiungi</button>
  </div>
</div>

<div class="cards-grid" id="lib-grid"></div>

<!-- Add/Edit modal -->
<div class="modal-overlay hidden" id="card-modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title-label">Aggiungi scheda</span>
      <button class="icon-btn" id="modal-close">✕</button>
    </div>
    <form id="card-form">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Tipo</label>
          <select class="form-select" id="modal-type" required>
            <option value="summary">Riassunto</option>
            <option value="qa">Domanda/Risposta</option>
            <option value="note">Nota</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Materia</label>
          <select class="form-select" id="modal-subject" required>
            <option>Italiano</option>
            <option>Inglese</option>
            <option>Informatica</option>
            <option>Sistemi e Reti</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Argomento / Tag</label>
        <input class="form-input" id="modal-topic" placeholder="es. Verbi irregolari" />
      </div>
      <div class="form-group">
        <label class="form-label">Titolo</label>
        <input class="form-input" id="modal-title-in" required placeholder="Titolo della scheda" />
      </div>
      <div class="form-group">
        <label class="form-label">Contenuto</label>
        <textarea class="form-textarea" id="modal-body" required placeholder="Testo, riassunto o domanda…"></textarea>
      </div>
      <div class="form-group" id="answer-group">
        <label class="form-label">Risposta</label>
        <textarea class="form-textarea" id="modal-answer" placeholder="Risposta alla domanda…" style="min-height:80px"></textarea>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" id="modal-cancel">Annulla</button>
        <button type="submit" class="btn btn-primary">Salva</button>
      </div>
    </form>
  </div>
</div>
