<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mykhub</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1e1e1e;
      --bg-sidebar: #191919;
      --bg-card: #242424;
      --border: rgba(255,255,255,0.07);
      --text: #e8e8e8;
      --text-muted: #777;
      --text-sec: #aaa;
      --accent: #7c6af7;
      --accent-dim: rgba(124,106,247,0.15);
      --code-bg: rgba(124,106,247,0.12);
    }
    [data-theme="light"] {
      --bg: #f5f5f0;
      --bg-sidebar: #ebebeb;
      --bg-card: #ffffff;
      --border: rgba(0,0,0,0.08);
      --text: #1a1a1a;
      --text-muted: #888;
      --text-sec: #555;
      --accent-dim: rgba(124,106,247,0.1);
      --code-bg: rgba(0,0,0,0.06);
    }

    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

    /* ── Top bar ── */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; height: 44px; border-bottom: 1px solid var(--border);
      background: var(--bg-sidebar); flex-shrink: 0; gap: 12px;
    }
    .topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand { font-size: 13px; font-weight: 700; color: var(--accent); text-decoration: none; flex-shrink: 0; }
    .topbar-sep { color: var(--border); font-size: 16px; }
    .space-label { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .btn-icon-sm {
      background: none; border: 1px solid var(--border); border-radius: 6px;
      padding: 5px 9px; font-size: 11px; color: var(--text-muted); cursor: pointer; white-space: nowrap;
    }
    .btn-icon-sm:hover { color: var(--text); border-color: var(--text-muted); }
    .menu-toggle { display: none; background: none; border: none; color: var(--text-sec); cursor: pointer; padding: 4px; }

    /* ── Layout ── */
    .layout { display: flex; flex: 1; min-height: 0; }

    /* ── Sidebar ── */
    .ws-sidebar {
      width: 240px; flex-shrink: 0; background: var(--bg-sidebar);
      border-right: 1px solid var(--border); overflow-y: auto; padding: 12px 8px;
    }
    .ws-sidebar::-webkit-scrollbar { width: 4px; }
    .ws-sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .tree-item {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 8px; border-radius: 5px; cursor: pointer;
      font-size: 13px; color: var(--text-sec); user-select: none;
      position: relative;
    }
    .tree-item:hover { background: var(--accent-dim); color: var(--text); }
    .tree-item.active { background: var(--accent-dim); color: var(--accent); font-weight: 500; }
    .tree-item .chevron {
      width: 12px; height: 12px; flex-shrink: 0; transition: transform 0.15s;
      opacity: 0.5;
    }
    .tree-item.open .chevron { transform: rotate(90deg); }
    .tree-item .icon { flex-shrink: 0; font-size: 13px; }
    .tree-item .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .tree-children { padding-left: 16px; }
    .tree-children.hidden { display: none; }

    /* ── Content ── */
    .ws-content { flex: 1; min-width: 0; overflow-y: auto; background: var(--bg); padding: 32px 48px 80px; }
    .ws-content::-webkit-scrollbar { width: 6px; }
    .ws-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .content-inner { max-width: 720px; margin: 0 auto; }

    .breadcrumb { font-size: 11px; color: var(--text-muted); margin-bottom: 10px; letter-spacing: 0.03em; }
    .breadcrumb span + span::before { content: ' › '; }
    .page-title { font-size: 26px; font-weight: 700; line-height: 1.25; margin-bottom: 28px; }
    .page-content { font-size: 15px; line-height: 1.75; }
    .page-content p { margin-bottom: 12px; }
    .page-content p:last-child { margin-bottom: 0; }
    .page-content strong { font-weight: 600; }
    .page-content em { font-style: italic; }
    .page-content code {
      font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 0.84em;
      background: var(--code-bg); border-radius: 4px; padding: 1px 5px;
    }
    .page-content ul, .page-content ol { padding-left: 22px; margin-bottom: 12px; }
    .page-content li { margin-bottom: 5px; }
    .page-content h1 { font-size: 21px; font-weight: 700; margin: 24px 0 10px; }
    .page-content h2 { font-size: 17px; font-weight: 600; margin: 20px 0 8px; }

    /* ── Empty / loading states ── */
    .state-box { text-align: center; padding: 80px 24px; color: var(--text-muted); }
    .state-box .icon { font-size: 32px; margin-bottom: 12px; }

    /* ── Mobile ── */
    @media (max-width: 640px) {
      .ws-sidebar { position: fixed; left: 0; top: 44px; bottom: 0; z-index: 100; transform: translateX(-100%); transition: transform 0.2s; width: 260px; }
      .ws-sidebar.open { transform: translateX(0); box-shadow: 4px 0 20px rgba(0,0,0,0.4); }
      .menu-toggle { display: block; }
      .ws-content { padding: 24px 20px 60px; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-left">
      <button class="menu-toggle" id="menu-toggle" aria-label="Menu">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5zm0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5z"/></svg>
      </button>
      <a class="brand" href="/">mykhub</a>
      <span class="topbar-sep">›</span>
      <span class="space-label" id="space-label">…</span>
    </div>
    <div class="topbar-right">
      <button class="btn-icon-sm" id="theme-btn">☀ / 🌙</button>
    </div>
  </div>

  <div class="layout">
    <nav class="ws-sidebar" id="ws-sidebar">
      <div id="tree-root"></div>
    </nav>
    <main class="ws-content" id="ws-content">
      <div class="state-box"><div class="icon">⏳</div><p>Caricamento…</p></div>
    </main>
  </div>

  <script>
    // ── Theme ──
    const root = document.documentElement;
    const stored = localStorage.getItem('mkh_share_theme');
    if (stored) root.dataset.theme = stored;
    document.getElementById('theme-btn').addEventListener('click', () => {
      const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
      root.dataset.theme = next;
      localStorage.setItem('mkh_share_theme', next);
    });

    // ── Mobile sidebar toggle ──
    const sidebar = document.getElementById('ws-sidebar');
    document.getElementById('menu-toggle').addEventListener('click', () => sidebar.classList.toggle('open'));
    document.getElementById('ws-content').addEventListener('click', () => sidebar.classList.remove('open'));

    // ── Tiptap → HTML ──
    function renderNode(node) {
      if (!node) return '';
      if (node.type === 'doc') return (node.content || []).map(renderNode).join('');
      if (node.type === 'paragraph') {
        const inner = (node.content || []).map(renderNode).join('');
        return `<p>${inner || '&nbsp;'}</p>`;
      }
      if (node.type === 'heading') {
        const lvl = node.attrs?.level || 1;
        return `<h${lvl}>${(node.content||[]).map(renderNode).join('')}</h${lvl}>`;
      }
      if (node.type === 'bulletList')  return `<ul>${(node.content||[]).map(renderNode).join('')}</ul>`;
      if (node.type === 'orderedList') return `<ol>${(node.content||[]).map(renderNode).join('')}</ol>`;
      if (node.type === 'listItem')    return `<li>${(node.content||[]).map(renderNode).join('')}</li>`;
      if (node.type === 'hardBreak')   return '<br>';
      if (node.type === 'text') {
        let t = (node.text||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        for (const m of (node.marks||[])) {
          if (m.type==='bold')   t = `<strong>${t}</strong>`;
          if (m.type==='italic') t = `<em>${t}</em>`;
          if (m.type==='code')   t = `<code>${t}</code>`;
          if (m.type==='link')   t = `<a href="${m.attrs?.href||'#'}" target="_blank" rel="noopener">${t}</a>`;
        }
        return t;
      }
      return (node.content||[]).map(renderNode).join('');
    }

    function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    // ── Build page tree ──
    let allPages = [];

    function getAncestors(page) {
      const ancestors = [];
      let cur = page;
      while (cur.parent_page_id) {
        const p = allPages.find(x => x.id === cur.parent_page_id);
        if (!p) break;
        ancestors.unshift(p.title);
        cur = p;
      }
      return ancestors;
    }

    function buildTree(pages, parentId, selectedId, onSelect) {
      const children = pages
        .filter(p => (p.parent_page_id || null) === (parentId || null))
        .sort((a,b) => a.order_index - b.order_index || a.id - b.id);

      if (!children.length) return null;
      const frag = document.createDocumentFragment();

      for (const page of children) {
        const hasChildren = pages.some(p => p.parent_page_id === page.id);
        const isActive = page.id === selectedId;
        const isOpen = isActive || pages.some(function findActive(p) {
          if (p.id === selectedId) return true;
          const kids = pages.filter(x => x.parent_page_id === p.id);
          return kids.some(findActive);
        });

        const item = document.createElement('div');
        item.className = 'tree-item' + (isActive ? ' active' : '') + (hasChildren ? ' open' : '');
        item.dataset.id = page.id;

        const chevronSvg = hasChildren
          ? `<svg class="chevron" viewBox="0 0 16 16" fill="currentColor"><path d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708z"/></svg>`
          : `<span style="width:12px;flex-shrink:0"></span>`;

        const icon = page.icon && page.icon !== 'folder' ? page.icon : (hasChildren ? '📁' : '📄');
        item.innerHTML = `${chevronSvg}<span class="icon">${icon}</span><span class="label">${esc(page.title)}</span>`;

        const childWrap = document.createElement('div');
        childWrap.className = 'tree-children';

        item.addEventListener('click', (e) => {
          e.stopPropagation();
          if (hasChildren) {
            item.classList.toggle('open');
            childWrap.classList.toggle('hidden', !item.classList.contains('open'));
          }
          onSelect(page);
        });

        const sub = buildTree(pages, page.id, selectedId, onSelect);
        if (sub) childWrap.appendChild(sub);
        frag.appendChild(item);
        frag.appendChild(childWrap);
      }
      return frag;
    }

    function showPage(page, space) {
      // Mark active in tree
      document.querySelectorAll('.tree-item').forEach(el => {
        el.classList.toggle('active', el.dataset.id == page.id);
      });

      const ancestors = getAncestors(page);
      const crumbParts = [space.name, ...ancestors].map(t => `<span>${esc(t)}</span>`).join('');
      const html = renderNode(page.content);
      const icon = page.icon && page.icon !== 'folder' ? page.icon + ' ' : '';

      document.getElementById('ws-content').innerHTML = `
        <div class="content-inner">
          ${crumbParts ? `<div class="breadcrumb">${crumbParts}</div>` : ''}
          <h1 class="page-title">${icon}${esc(page.title)}</h1>
          <div class="page-content">${html || '<p style="color:var(--text-muted)">Pagina vuota.</p>'}</div>
        </div>
      `;
      // close mobile sidebar
      document.getElementById('ws-sidebar').classList.remove('open');
      // scroll to top
      document.getElementById('ws-content').scrollTop = 0;
    }

    // ── Load space ──
    const token = location.pathname.replace(/^\/ws\//, '');
    if (!token || token === location.pathname) {
      document.getElementById('ws-content').innerHTML =
        '<div class="state-box"><div class="icon">🔗</div><p>Link non valido.</p></div>';
    } else {
      fetch(`/api/public/space/${token}`)
        .then(r => { if (!r.ok) throw new Error(); return r.json(); })
        .then(({ space, pages }) => {
          allPages = pages;
          document.title = `${space.name} — mykhub`;
          document.getElementById('space-label').textContent = `${space.icon} ${space.name}`;

          const firstPage = pages.find(p => !p.parent_page_id) || pages[0];
          const treeRoot = document.getElementById('tree-root');

          function onSelect(page) {
            showPage(page, space);
            // rebuild tree with new active selection
            treeRoot.innerHTML = '';
            const tree = buildTree(pages, null, page.id, onSelect);
            if (tree) treeRoot.appendChild(tree);
          }

          if (firstPage) {
            const tree = buildTree(pages, null, firstPage.id, onSelect);
            if (tree) treeRoot.appendChild(tree);
            showPage(firstPage, space);
          } else {
            document.getElementById('ws-content').innerHTML =
              '<div class="state-box"><div class="icon">📭</div><p>Nessuna pagina in questo spazio.</p></div>';
          }
        })
        .catch(() => {
          document.getElementById('ws-content').innerHTML =
            '<div class="state-box"><div class="icon">🔒</div><p>Spazio non trovato o accesso revocato.</p></div>';
        });
    }
  </script>
</body>
</html>
