<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mykhub — pagina condivisa</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1e1e1e;
      --bg-card: #242424;
      --border: rgba(255,255,255,0.08);
      --text: #e8e8e8;
      --text-muted: #888;
      --accent: #7c6af7;
      --code-bg: rgba(124,106,247,0.12);
    }
    [data-theme="light"] {
      --bg: #f5f5f0;
      --bg-card: #ffffff;
      --border: rgba(0,0,0,0.08);
      --text: #1a1a1a;
      --text-muted: #777;
      --code-bg: rgba(0,0,0,0.06);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 32px 16px 80px;
    }

    .page-wrap {
      max-width: 720px;
      margin: 0 auto;
    }

    /* ── Header ── */
    .share-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 40px;
    }
    .brand {
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.04em;
      text-decoration: none;
    }
    .theme-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
    }
    .theme-btn:hover { color: var(--text); border-color: var(--text-muted); }

    /* ── Breadcrumb ── */
    .breadcrumb {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.03em;
      margin-bottom: 12px;
    }
    .breadcrumb span + span::before { content: ' › '; }

    /* ── Title ── */
    .page-title {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 32px;
      color: var(--text);
    }

    /* ── Content ── */
    .page-content { font-size: 15px; line-height: 1.7; }
    .page-content p { margin-bottom: 12px; }
    .page-content p:last-child { margin-bottom: 0; }
    .page-content strong { font-weight: 600; }
    .page-content code {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 0.85em;
      background: var(--code-bg);
      border-radius: 4px;
      padding: 1px 5px;
    }
    .page-content ul { padding-left: 20px; margin-bottom: 12px; }
    .page-content li { margin-bottom: 5px; }
    .page-content h1 { font-size: 22px; font-weight: 700; margin: 24px 0 10px; }
    .page-content h2 { font-size: 18px; font-weight: 600; margin: 20px 0 8px; }

    /* ── Footer ── */
    .share-footer {
      margin-top: 56px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .share-footer a { color: var(--accent); text-decoration: none; }
    .share-footer a:hover { text-decoration: underline; }

    /* ── States ── */
    .state-box {
      text-align: center;
      padding: 80px 24px;
      color: var(--text-muted);
    }
    .state-box .icon { font-size: 32px; margin-bottom: 12px; }
    .state-box p { font-size: 15px; }
  </style>
</head>
<body>
  <div class="page-wrap">
    <header class="share-header">
      <a class="brand" href="/">mykhub</a>
      <button class="theme-btn" id="theme-btn">☀ Chiaro / 🌙 Scuro</button>
    </header>
    <div id="content">
      <div class="state-box"><div class="icon">⏳</div><p>Caricamento…</p></div>
    </div>
  </div>

  <script>
    // ── Theme toggle ──
    const root = document.documentElement;
    const stored = localStorage.getItem('mkh_share_theme');
    if (stored) root.dataset.theme = stored;
    document.getElementById('theme-btn').addEventListener('click', () => {
      const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
      root.dataset.theme = next;
      localStorage.setItem('mkh_share_theme', next);
    });

    // ── Tiptap JSON → HTML renderer ──
    function renderNode(node) {
      if (!node) return '';
      if (node.type === 'doc') return (node.content || []).map(renderNode).join('');
      if (node.type === 'paragraph') {
        const inner = (node.content || []).map(renderNode).join('');
        return `<p>${inner || '&nbsp;'}</p>`;
      }
      if (node.type === 'heading') {
        const lvl = node.attrs?.level || 1;
        const inner = (node.content || []).map(renderNode).join('');
        return `<h${lvl}>${inner}</h${lvl}>`;
      }
      if (node.type === 'bulletList') {
        return `<ul>${(node.content || []).map(renderNode).join('')}</ul>`;
      }
      if (node.type === 'orderedList') {
        return `<ol>${(node.content || []).map(renderNode).join('')}</ol>`;
      }
      if (node.type === 'listItem') {
        return `<li>${(node.content || []).map(renderNode).join('')}</li>`;
      }
      if (node.type === 'hardBreak') return '<br>';
      if (node.type === 'text') {
        let t = (node.text || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        const marks = node.marks || [];
        for (const m of marks) {
          if (m.type === 'bold')   t = `<strong>${t}</strong>`;
          if (m.type === 'italic') t = `<em>${t}</em>`;
          if (m.type === 'code')   t = `<code>${t}</code>`;
          if (m.type === 'link')   t = `<a href="${m.attrs?.href||'#'}" target="_blank" rel="noopener">${t}</a>`;
        }
        return t;
      }
      return (node.content || []).map(renderNode).join('');
    }

    // ── Load page ──
    const token = location.pathname.replace(/^\/s\//, '');
    if (!token || token === location.pathname) {
      document.getElementById('content').innerHTML =
        '<div class="state-box"><div class="icon">🔗</div><p>Link non valido.</p></div>';
    } else {
      fetch(`/api/public/${token}`)
        .then(r => { if (!r.ok) throw new Error('not found'); return r.json(); })
        .then(page => {
          const crumbs = [page.space_name, ...page.breadcrumb]
            .filter(Boolean)
            .map(t => `<span>${t.replace(/</g,'&lt;')}</span>`)
            .join('');
          const html = renderNode(page.content);
          const updated = new Date(page.updated_at).toLocaleDateString('it-IT', { day:'2-digit', month:'long', year:'numeric' });
          document.title = `${page.title} — mykhub`;
          document.getElementById('content').innerHTML = `
            ${crumbs ? `<div class="breadcrumb">${crumbs}</div>` : ''}
            <h1 class="page-title">${page.icon || ''} ${(page.title||'').replace(/</g,'&lt;')}</h1>
            <div class="page-content">${html}</div>
            <footer class="share-footer">
              Condiviso da <a href="/">mykhub</a> · Ultimo aggiornamento ${updated}
            </footer>
          `;
        })
        .catch(() => {
          document.getElementById('content').innerHTML =
            '<div class="state-box"><div class="icon">🔒</div><p>Pagina non trovata o accesso revocato.</p></div>';
        });
    }
  </script>
</body>
</html>
